# ===========================================================================
# 行为限制区域（action-blocked）
#
# 本文件**独立于 config.yml**，专门配置「该区域内禁止原地动作」的范围：
# 区域内的玩家不能骑乘（含骑在其他玩家/生物/载具上），判定到直接取消动作，
# 并提示 messages.action-blocked（文案在 config.yml 里）。
#
# 是否连潜行一起禁，由 config.yml 的 start.block-sneak 统一控制（默认 false）。
#
# 与 config.yml 的分工：
#   - 本文件只管「行为限制区域」，因此区域可以位于**任意世界**，
#     不要求与 config.yml 的 world 一致；
#   - config.yml 的 regions.notify 从此只负责「提示可见范围」，
#     不再参与行为限制判定 —— 场地那片限制区已经迁到本文件的 game-arena；
#   - /fmwar reload 会同时重载两个文件；本文件解析失败时只保留上一份限制区域，
#     不影响 config.yml 与进行中的对局。
#
# 生效对象：**区域内的任何玩家**，不限本局相关玩家。因为这里列出的区域不一定属于
# 本插件的场地，也不受本插件管理；写进本清单即表示「这片地方谁都不许骑乘」。
#
# 区域写法（两种任选，与 config.yml 的 regions 完全一致）：
#   角点：  min: [x, y, z] / max: [x, y, z]（两个角点顺序无关，自动取小/大为 min/max）
#   区域块：x/y/z + dx/dy/dz（与 /fill、WorldEdit 的区域记法相同，dx/dy/dz 可为负）
# 每个区域可用 world: 单独覆盖，缺省即顶层 world。
# name 只用于日志与 /fmwar doctor 自检，可省略。
# ===========================================================================

# 顶层默认世界：区域未单独写 world 时使用
world: SurvivalWorld

regions:
  # -------------------------------------------------------------------------
  # 游戏场地：沿用原 config.yml 里 regions.notify 的范围（行为限制的判定口径）。
  #   x=-1354, y=39, z=-2041 起，dx=497 / dy=281 / dz=652
  #   展开后：x -1354~-857、y 39~320、z -2041~-1389（＝原 notify 的 min/max）
  # 注意：world 必须与 config.yml 的 world 保持一致，改了那边记得同步这里。
  # -------------------------------------------------------------------------
  - name: game-arena
    world: game
    x: -1354
    y: 39
    z: -2041
    dx: 497
    dy: 281
    dz: 652

  # -------------------------------------------------------------------------
  # 生存世界限制区 1（区域块写法）
  #   x=260, y=310, z=7135 起，dx=385 / dy=-310 / dz=-385
  #   展开后：x 260~645、y 0~310、z 6750~7135
  # -------------------------------------------------------------------------
  - name: survival-area-1
    world: SurvivalWorld
    x: 260
    y: 310
    z: 7135
    dx: 385
    dy: -310
    dz: -385

  # -------------------------------------------------------------------------
  # 生存世界限制区 2（区域块写法）
  #   x=-800, y=-30, z=6175 起，dx=532 / dy=330 / dz=296
  #   展开后：x -800~-268、y -30~300、z 6175~6471
  # -------------------------------------------------------------------------
  - name: survival-area-2
    world: SurvivalWorld
    x: -800
    y: -30
    z: 6175
    dx: 532
    dy: 330
    dz: 296
